<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <style>
    body{font-family:Georgia,serif;max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.6;background:#faf9f6;color:#222}
    h1,h2,h3,h4{margin-top:1.5rem}
    img{max-width:100%;height:auto}
    figure{margin:1rem 0;text-align:center}
    figcaption{color:#888;font-size:.9rem}
    a{color:#1a73e8}
    header{background:#22415f;padding:1rem 2rem;margin:-2rem -1rem 2rem}
    header a{color:#fff;text-decoration:none;font-size:1.3rem}
  </style>
</head>
<body>
  <header><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></header>
  <main>{{ block "main" . }}{{ end }}</main>
</body>
</html>
